
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- التكبير مسموح حتى 5×: التطبيق يُستعمل في الشارع وتحت ضوء النهار،
       ومنعه كان يحرم من يحتاج تكبير النص من قراءته. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cus-Follow — متابعة العملاء</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png?v=710e278b">
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=710e278b">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=710e278b">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon.png?v=710e278b">
  <script src="./android-bridge.js"></script>
  <!-- Tailwind لم يعد يُحمَّل من CDN ويُبنى وقت التشغيل.
       يُولَّد الآن وقت البناء ويصل ضمن حزمة الأنماط المبصومة. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- الخطوط لا توقف رسم الشاشة: تُحمَّل بالتوازي وتُطبَّق حين تصل (display=swap).
       كانت rel="stylesheet" مباشرة، فتنتظر الشاشة اتصالاً جديداً بخوادم جوجل قبل
       أن ترسم أي شيء. الوزن 300 وSora 600 حُذفا — غير مستعملين. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Sora:wght@700;800&display=swap"></noscript>
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
      overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="select-none">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered!', reg))
          .catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
